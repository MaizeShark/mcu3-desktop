# Download sources for the files in payload/.
# All from Ubuntu 16.04 (xenial), found 2026-09-23; each extracted file verified against its hash.
#
# mcu2_patch.py uses payload/<path> if it's there. If not, it downloads it from the url below.
# Fill in per file:
#   url     direct link to the file, or to a package/archive containing it
#           (.deb, .tar.gz, .tar.xz, .tar.bz2, .tar.zst, .zip)
#   sha256  sha256 of what `url` downloads (run `sha256sum` on it). If left empty the script
#           prints it, so you can paste it here afterwards.
#   member  only for packages/archives: path of the file inside, e.g.
#           "usr/lib/x86_64-linux-gnu/dri/swrast_dri.so" (leading "./" optional,
#           symlinks inside the package are followed)
#
# Several entries may use the same url; each package is downloaded once (cached in downloads/).
# Whatever gets extracted is always checked against the exact hash in mcu2_patch.py, so a
# wrong package version is caught.
#
# icu_preload.so and the fake chrome-sandbox need no entry: they are compiled from src/.
#
# Example:
# ["usr/lib/libexample.so.1.2.3"]
# url    = "https://example.org/pool/libexample1_1.2.3-1_amd64.deb"
# sha256 = "3f2a...e91c"
# member = "usr/lib/x86_64-linux-gnu/libexample.so.1.2.3"

["usr/lib/dri/swrast_dri.so"]
